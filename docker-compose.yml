services:
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    working_dir: /app
    command: npm run start:dev
    environment:
      NODE_ENV: development
      PORT: 3000
      TRUST_PROXY: "true"
      CORS_ORIGINS: ${CORS_ORIGINS:-https://localhost}
      ENCRYPTION_ACTIVE_KEY_ID: ${ENCRYPTION_ACTIVE_KEY_ID:-1}
      ENCRYPTION_KEY_1: ${ENCRYPTION_KEY_1:-}
      ENCRYPTION_KEY_2: ${ENCRYPTION_KEY_2:-}
      ENCRYPTION_KEY_3: ${ENCRYPTION_KEY_3:-}
      ENCRYPTION_KEY_4: ${ENCRYPTION_KEY_4:-}
      JWT_PRIVATE_KEY_PATH: /run/secrets/auth/jwt_private.pem
      JWT_PUBLIC_KEY_PATH: /run/secrets/auth/jwt_public.pem
      JWT_ISSUER: ${JWT_ISSUER:-dia-backend}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-dia-api}
      REFRESH_TOKEN_TTL_SECONDS: ${REFRESH_TOKEN_TTL_SECONDS:-604800}
      REFRESH_COOKIE_SAME_SITE: ${REFRESH_COOKIE_SAME_SITE:-lax}
      OIDC_ISSUER_URL: ${OIDC_ISSUER_URL:-}
      SSO_PROTOCOL: ${SSO_PROTOCOL:-oidc}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_REDIRECT_URI: ${OIDC_REDIRECT_URI:-}
      OIDC_NIM_CLAIM: ${OIDC_NIM_CLAIM:-nim}
      OIDC_SCOPES: ${OIDC_SCOPES:-openid email profile}
      AKADEMIK_MODE: ${AKADEMIK_MODE:-mock}
      AKADEMIK_STATUS_URL: ${AKADEMIK_STATUS_URL:-}
      AKADEMIK_API_TOKEN: ${AKADEMIK_API_TOKEN:-}
      AKADEMIK_MOCK_ACTIVE_NIMS: ${AKADEMIK_MOCK_ACTIVE_NIMS:-}
      FRONTEND_LOGIN_SUCCESS_URL: ${FRONTEND_LOGIN_SUCCESS_URL:-https://localhost/}
      FRONTEND_LOGIN_FAILURE_URL: ${FRONTEND_LOGIN_FAILURE_URL:-https://localhost/masuk}
      DATABASE_URL: ${DATABASE_URL:-postgres://denger_app:${APP_DB_PASSWORD:-dia_app_dev_only}@postgres:5432/${POSTGRES_DB:-denger}}
      REPORT_DATABASE_URL: postgres://denger_report:${REPORT_DB_PASSWORD:-dia_report_dev_only}@postgres:5432/${POSTGRES_DB:-denger}
      REDIS_HOST: redis
      REDIS_PORT: 6379
    expose:
      - "3000"
    volumes:
      - ./apps/api:/app
      - ./infra/auth:/run/secrets/auth:ro
      - api_node_modules:/app/node_modules
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  gateway:
    build:
      context: ./infra/gateway
    environment:
      TLS_MODE: ${TLS_MODE:-development}
    ports:
      - "${GATEWAY_HTTP_PORT:-80}:80"
      - "${GATEWAY_HTTPS_PORT:-443}:443"
    volumes:
      - ./infra/gateway/certs:/etc/nginx/certs
      - ./infra/gateway/proxy_params:/etc/nginx/proxy_params:ro
    depends_on:
      api:
        condition: service_started

  migrate:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    working_dir: /app
    command: npm run migration:run
    environment:
      NODE_ENV: development
      MIGRATION_DATABASE_URL: postgres://denger_owner:${POSTGRES_PASSWORD:-dia_owner_dev_only}@postgres:5432/${POSTGRES_DB:-denger}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-dia_app_dev_only}
      REPORT_DB_PASSWORD: ${REPORT_DB_PASSWORD:-dia_report_dev_only}
    volumes:
      - ./apps/api:/app
      - api_node_modules:/app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  backup:
    profiles: ["backup"]
    user: "0:0"
    build:
      context: ./infra/backup
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:-denger}
      POSTGRES_USER: denger_owner
      PGPASSWORD: ${POSTGRES_PASSWORD:-dia_owner_dev_only}
      BACKUP_AGE_RECIPIENT: ${BACKUP_AGE_RECIPIENT:-}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_RETRY_SECONDS: ${BACKUP_RETRY_SECONDS:-300}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
    volumes:
      - ./backups:/backups
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-denger}
      POSTGRES_USER: denger_owner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dia_owner_dev_only}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
  redis_data:
  api_node_modules:
