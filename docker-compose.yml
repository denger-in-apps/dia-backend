services:
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    working_dir: /app
    command: npm run start:dev
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: ${DATABASE_URL:-postgres://denger_app:${APP_DB_PASSWORD:-dia_app_dev_only}@postgres:5432/${POSTGRES_DB:-denger}}
      REPORT_DATABASE_URL: postgres://denger_report:${REPORT_DB_PASSWORD:-dia_report_dev_only}@postgres:5432/${POSTGRES_DB:-denger}
      REDIS_HOST: redis
      REDIS_PORT: 6379
    ports:
      - "${API_PORT:-3000}:3000"
    volumes:
      - ./apps/api:/app
      - api_node_modules:/app/node_modules
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  migrate:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    working_dir: /app
    command: npm run migration:run
    environment:
      NODE_ENV: development
      MIGRATION_DATABASE_URL: postgres://denger_owner:${POSTGRES_PASSWORD:-dia_owner_dev_only}@postgres:5432/${POSTGRES_DB:-denger}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-dia_app_dev_only}
      REPORT_DB_PASSWORD: ${REPORT_DB_PASSWORD:-dia_report_dev_only}
    volumes:
      - ./apps/api:/app
      - api_node_modules:/app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-denger}
      POSTGRES_USER: denger_owner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dia_owner_dev_only}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
  redis_data:
  api_node_modules:
