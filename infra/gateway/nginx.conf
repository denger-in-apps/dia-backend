worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  server_tokens off;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  map $host $hsts_value {
    default     "max-age=31536000";
    localhost   "";
    127.0.0.1   "";
    "[::1]"     "";
  }

  limit_req_zone $binary_remote_addr zone=api_rate:10m rate=30r/s;
  limit_req_zone $binary_remote_addr zone=auth_rate:10m rate=10r/m;
  limit_conn_zone $binary_remote_addr zone=per_ip_conn:10m;

  upstream dia_api {
    server api:3000;
    keepalive 32;
  }

  server {
    listen 80 default_server;
    server_name _;
    return 308 https://$host$request_uri;
  }

  server {
    listen 443 ssl default_server;
    server_name _;

    ssl_certificate     /etc/nginx/certs/tls.crt;
    ssl_certificate_key /etc/nginx/certs/tls.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:TLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;

    client_max_body_size 2m;
    limit_req_status 429;
    limit_conn_status 429;
    limit_conn per_ip_conn 50;

    add_header Strict-Transport-Security "$hsts_value" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "geolocation=(self), camera=(), microphone=(self)" always;

    location = /health/live {
      access_log off;
      proxy_pass http://dia_api;
      include /etc/nginx/proxy_params;
    }

    location ^~ /api/v1/auth {
      limit_req zone=api_rate burst=60 nodelay;
      limit_req zone=auth_rate burst=10 nodelay;
      proxy_pass http://dia_api;
      include /etc/nginx/proxy_params;
    }

    location / {
      limit_req zone=api_rate burst=60 nodelay;
      proxy_pass http://dia_api;
      include /etc/nginx/proxy_params;
    }
  }
}
